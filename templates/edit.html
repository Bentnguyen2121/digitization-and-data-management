{% extends "layout.html" %}

{% block content %}
<div class="container">
    <div class="card shadow-sm border-0 mt-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>Chỉnh sửa khách hàng #{{ c.id }}</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Tuổi</label>
                    <input type="number" name="age" class="form-control" value="{{ c.age }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nghề nghiệp</label>
                    <input type="text" name="job" class="form-control" value="{{ c.job }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Số dư ($)</label>
                    <input type="number" name="balance" class="form-control" value="{{ c.balance }}" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Lưu thay đổi</button>
                    <a href="/customers" class="btn btn-secondary">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
